name: Testar webhook WhatsApp (sem mensagens reais)

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/services/whatsapp_webhook.py"
      - "backend/app/models/whatsapp_event.py"
      - "backend/app/routers/whatsapp.py"
      - "backend/app/main.py"
      - "backend/app/core/config.py"
      - "backend/app/core/database.py"
      - "backend/tests/test_whatsapp_webhook.py"
      - ".github/workflows/test-whatsapp-webhook.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ""
      WHATSAPP_APP_SECRET: ""
      WHATSAPP_AUTO_REPLY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias para testes HTTP locais
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi==0.115.6" "pydantic-settings==2.7.1" "sqlalchemy==2.0.36" "psycopg[binary]==3.2.3" "httpx==0.28.1"
      - name: Testar validacao, assinatura e deduplicacao sem API externa
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_whatsapp_*.py" -v
