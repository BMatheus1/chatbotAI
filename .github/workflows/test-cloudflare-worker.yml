name: Validar Worker do WhatsApp sem mensagens reais

on:
  push:
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - ".github/workflows/test-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes sem chamadas externas
        run: node --test cloudflare/worker.test.mjs
